name: medialert_ai
description: Smart Medicine Reminder with AI Assistant
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9

  # State Management
  provider: ^6.1.5

  # Local Storage
  shared_preferences: ^2.5.5

  # Notifications
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

  # Permissions
  permission_handler: ^12.0.1

  # Networking (OpenRouter / OpenAI AI)
  http: ^1.6.0

  # Charts & Calendar
  fl_chart: ^1.0.0
  table_calendar: ^3.2.0

  # Image Picker
  image_picker: ^1.2.0

  # UI & Styling
  google_fonts: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/